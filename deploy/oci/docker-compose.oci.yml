services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - ./env/backend.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    env_file:
      - ./env/frontend.env
    ports:
      - "8501:8501"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-change-me}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
